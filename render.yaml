services:
  - type: web
    name: mujeeb24-api
    runtime: docker
    plan: free
    branch: refactor/merchant-catalog-ai-v2-structure
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: checksPass
    healthCheckPath: /
    maxShutdownDelaySeconds: 60

    envVars:
      - key: APP_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: AUTH_ENABLED
        value: "true"

      - key: JWT_ISSUER
        value: mujeeb24

      - key: JWT_ED25519_PRIVATE_KEY
        sync: false

      - key: JWT_ED25519_PUBLIC_KEY
        sync: false

      - key: AI_CONFIG_ENCRYPTION_KEY
        sync: false

      - key: SOCIALAPI_BASE_URL
        value: https://api.social-api.ai

      - key: SOCIALAPI_API_KEY
        sync: false

      - key: SOCIALAPI_WEBHOOK_SECRET
        sync: false

      - key: FRONTEND_URL
        value: https://mujeeb24-frontend.ai.studio/landing

      - key: CHANNEL_PROVISIONING_ENABLED
        value: "false"

      - key: AUTOREPLY_ENABLED
        value: "false"

      - key: LLM_ENABLED
        value: "false"

  # LiteLLM gateway is a separate Render web service; do not change the
  # existing API deployment branch or turn on live customer replies here.
  # Uses a dedicated EXTERNAL PostgreSQL database for keys, models, and spend.
  # Render-managed 256-bit secrets are never committed to Git.
  # A tiny wrapper adds the sk- prefix and invokes the official entrypoint.
  # Keep the existing API service's branch and settings unchanged.
  - type: web
    name: mujeeb24-litellm
    runtime: docker
    plan: free
    branch: feat/ai-litellm-multi-provider-gateway
    dockerfilePath: ./deploy/litellm/Dockerfile.render
    autoDeployTrigger: off
    healthCheckPath: /health/readiness

    envVars:
      - key: PORT
        value: "4000"

      # Neon database dedicated to LiteLLM, NEVER Mujeeb's own DATABASE_URL.
      - key: DATABASE_URL
        sync: false

      # Created once by Render on first Blueprint sync; retained on redeploy.
      - key: LITELLM_MASTER_KEY_SEED
        generateValue: true

      - key: LITELLM_SALT_KEY_SEED
        generateValue: true

      - key: STORE_MODEL_IN_DB
        value: "True"

      - key: UI_USERNAME
        value: admin

      - key: UI_PASSWORD
        generateValue: true

      - key: LITELLM_HIDE_DEFAULT_CREDENTIALS_HINT
        value: "true"
