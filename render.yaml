# Mujeeb 24 API ONLY: existing backend service, NOT LiteLLM.
# Gateway is managed by an independent Blueprint at
# deploy/litellm/render.blueprint.yaml in the SAME GitHub branch.
# Keep existing DATABASE_URL/JWT/encryption/SocialAPI secrets in Render.
# LiteLLM_BASE_URL and LITELLM_API_KEY are supplied manually in API Environment.
# Do NOT sync this root Blueprint to create a gateway.
services:
  - type: web
    name: mujeeb24-api
    runtime: docker
    plan: free
    branch: feat/ai-litellm-multi-provider-gateway
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: off
    healthCheckPath: /
    maxShutdownDelaySeconds: 60
    envVars:
      - key: APP_ENV
        value: production
      # Keep the ORIGINAL Mujeeb merchant/business database.
      - key: DATABASE_URL
        sync: false
      - key: AUTH_ENABLED
        value: "true"
      - key: JWT_ISSUER
        value: mujeeb24
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: REFRESH_SESSION_TTL
        value: 720h
      - key: JWT_ED25519_PRIVATE_KEY
        sync: false
      - key: JWT_ED25519_PUBLIC_KEY
        sync: false
      # Do not auto-rotate the existing encryption key: existing records use it.
      - key: AI_CONFIG_ENCRYPTION_KEY
        sync: false
      - key: SOCIALAPI_BASE_URL
        value: https://api.social-api.ai
      - key: SOCIALAPI_API_KEY
        sync: false
      - key: SOCIALAPI_WEBHOOK_SECRET
        sync: false
      - key: SOCIALAPI_HTTP_TIMEOUT
        value: 10s
      - key: CHANNEL_PROVISIONING_ENABLED
        value: "true"
      - key: CHANNEL_PROVISIONING_REDIRECT_URI
        value: https://mujeeb24-api.onrender.com/oauth/socialapi/callback
      - key: FRONTEND_URL
        value: https://mujeeb24.com/landing
      - key: LLM_ENABLED
        value: "false"
      # Current Mujeeb production feature-flag values supplied by the owner.
      # AutoReply requires working LiteLLM credentials before its first deploy.
      - key: AUTOREPLY_ENABLED
        value: "true"
      - key: CUSTOMER_SALES_ENABLED
        value: "false"
      # Keep existing process/database tuning explicit in this ONE Blueprint.
      - key: DB_CONNECT_TIMEOUT
        value: 5s
      - key: DB_HEALTH_CHECK_PERIOD
        value: 1m
      - key: DB_MAX_CONNS
        value: "5"
      - key: DB_MAX_CONN_IDLE_TIME
        value: 10m
      - key: DB_MAX_CONN_LIFETIME
        value: 1h
      - key: DB_MIN_CONNS
        value: "0"
      - key: WORKER_BATCH_SIZE
        value: "20"
      - key: WORKER_OWNER
        value: mujeeb-render-worker
      - key: WORKER_POLL_INTERVAL
        value: 2s
      - key: SHUTDOWN_TIMEOUT
        value: 10s
      - key: LITELLM_GATEWAY_ONLY
        value: "true"
      # LiteLLM has its OWN Blueprint; set its Render URL in this API service.
      # Example: https://<your-litellm-service>.onrender.com (no /v1 suffix)
      - key: LITELLM_BASE_URL
        sync: false
      # Must be a valid Virtual Key created in LiteLLM (not an arbitrary secret).
      - key: LITELLM_API_KEY
        sync: false
      - key: LITELLM_CUSTOMER_MODEL
        value: mujeeb-customer
      - key: LITELLM_CATALOG_MODEL
        value: mujeeb-catalog
      - key: LITELLM_MERCHANT_MODEL
        value: mujeeb-merchant
      - key: LITELLM_HTTP_TIMEOUT
        value: 200s
      - key: LITELLM_MAX_CONTEXT_TOKENS
        value: "32768"
      - key: LITELLM_MAX_OUTPUT_TOKENS
        value: "4096"
      - key: LITELLM_MAX_INPUT_CHARACTERS
        value: "48000"
      - key: LITELLM_MERCHANT_MAX_REQUEST_BYTES
        value: "524288"
      # Explicit accounting decision; never invent a USD/YER rate.
      - key: LITELLM_USD_TO_YER_RATE
        sync: false
