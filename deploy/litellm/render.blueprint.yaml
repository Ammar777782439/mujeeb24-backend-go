# Dedicated LiteLLM gateway Blueprint. Does NOT create or reconfigure mujeeb24-api.
# Choose this file as the Blueprint path in Render, not the root render.yaml.
# Random credentials are managed by Render and persist across redeploys.
services:
  - type: web
    name: mujeeb24-litellm
    runtime: docker
    plan: free
    branch: feat/ai-litellm-multi-provider-gateway
    dockerfilePath: ./deploy/litellm/Dockerfile.render
    autoDeployTrigger: off
    healthCheckPath: /health/readiness
    envVars:
      - key: PORT
        value: "4000"
      # Dedicated persistent LiteLLM settings/spend DB, NOT the Mujeeb merchant DB.
      - key: DATABASE_URL
        sync: false
      - key: LITELLM_MASTER_KEY_SEED
        generateValue: true
      - key: LITELLM_SALT_KEY_SEED
        generateValue: true
      - key: UI_USERNAME
        value: admin
      - key: UI_PASSWORD
        generateValue: true
      - key: STORE_MODEL_IN_DB
        value: "True"
      - key: LITELLM_HIDE_DEFAULT_CREDENTIALS_HINT
        value: "true"
