services:
  mujeeb-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${MUJEEB_POSTGRES_DATABASE:?run scripts/init-test-env.ps1 first}
      POSTGRES_USER: ${MUJEEB_POSTGRES_USERNAME:?run scripts/init-test-env.ps1 first}
      POSTGRES_PASSWORD: ${MUJEEB_POSTGRES_PASSWORD:?run scripts/init-test-env.ps1 first}
    volumes:
      - mujeeb_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5433:5432"
    restart: unless-stopped

  mujeeb-migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - ${LOCAL_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${MUJEEB_POSTGRES_USERNAME}:${MUJEEB_POSTGRES_PASSWORD}@mujeeb-postgres:5432/${MUJEEB_POSTGRES_DATABASE}?sslmode=disable
    command: ["/usr/local/bin/mujeeb-migrate"]
    depends_on:
      mujeeb-postgres:
        condition: service_healthy
    restart: "no"

  mujeeb-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - ${LOCAL_ENV_FILE:-.env}
    environment:
      HTTP_ADDR: :3001
      DATABASE_URL: postgres://${MUJEEB_POSTGRES_USERNAME}:${MUJEEB_POSTGRES_PASSWORD}@mujeeb-postgres:5432/${MUJEEB_POSTGRES_DATABASE}?sslmode=disable
    ports:
      - "127.0.0.1:${MUJEEB_HOST_PORT:-3001}:3001"
    depends_on:
      mujeeb-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  mujeeb-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - ${LOCAL_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgres://${MUJEEB_POSTGRES_USERNAME}:${MUJEEB_POSTGRES_PASSWORD}@mujeeb-postgres:5432/${MUJEEB_POSTGRES_DATABASE}?sslmode=disable
      WORKER_OWNER: mujeeb24-compose-worker
    command: ["/usr/local/bin/mujeeb-worker"]
    depends_on:
      mujeeb-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  webhook-gateway:
    image: caddy:2.10-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      mujeeb-api:
        condition: service_started
    restart: unless-stopped

  quick-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["quick-tunnel"]
    depends_on:
      webhook-gateway:
        condition: service_started
    command: tunnel --no-autoupdate --url http://webhook-gateway:8080

  named-tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["named-tunnel"]
    depends_on:
      webhook-gateway:
        condition: service_started
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-MISSING_TUNNEL_TOKEN}
    restart: unless-stopped

volumes:
  mujeeb_postgres:
