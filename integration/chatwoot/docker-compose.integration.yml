services:
  base: &base
    image: chatwoot/chatwoot:latest-ce
    env_file:
      - .env
    network_mode: host
    volumes:
      - chatwoot_storage:/app/storage

  rails:
    <<: *base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3300", "-b", "127.0.0.1"]
    restart: "no"

  sidekiq:
    <<: *base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      RAILS_ENV: production
      INSTALLATION_ENV: docker
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    network_mode: host
    command: ["postgres", "-p", "55432"]
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - chatwoot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 55432 -U postgres -d chatwoot"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    network_mode: host
    command: ["sh", "-c", "redis-server --port 56379 --requirepass \"$${REDIS_PASSWORD}\""]
    env_file:
      - .env
    volumes:
      - chatwoot_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 56379 -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  chatwoot_storage:
  chatwoot_postgres:
  chatwoot_redis:
