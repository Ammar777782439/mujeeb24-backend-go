name: Temporary AI Assist PostgreSQL integration gofmt
on:
  push:
    branches: [feat/merchant-ai-assist]
    paths: ['.github/workflows/merchant-assist-postgres-gofmt-temp.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/merchant-ai-assist
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          gofmt -w internal/adapters/secondary/persistence/postgres/merchant_assist_isolation_integration_test.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/adapters/secondary/persistence/postgres/merchant_assist_isolation_integration_test.go
          if ! git diff --cached --quiet; then
            git commit -m 'style(ai-assist): gofmt PostgreSQL integration isolation test'
            git push origin HEAD:feat/merchant-ai-assist
          fi
