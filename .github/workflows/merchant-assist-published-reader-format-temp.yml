name: Temporary published reader gofmt
on:
  push:
    branches: [feat/merchant-ai-assist]
    paths:
      - '.github/workflows/merchant-assist-published-reader-format-temp.yml'
      - 'internal/application/merchantassist/published_reader*.go'
permissions:
  contents: write
jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/merchant-ai-assist
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - name: Format new application read facade only
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/application/merchantassist/published_reader*.go
          if git diff --quiet -- internal/application/merchantassist; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/application/merchantassist/published_reader*.go
          git commit -m 'style(ai-assist): gofmt published knowledge reader'
          git push origin HEAD:feat/merchant-ai-assist
