name: Format merchant assistant batched tool test
on:
  push:
    branches: [feat/merchant-ai-assist]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format new Go regression test
        run: |
          gofmt -w internal/application/merchantassist/assistant_multi_tool_test.go
          git diff --check
          git add internal/application/merchantassist/assistant_multi_tool_test.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(merchant-assist): format batched tool regression tests'
            git push origin HEAD:feat/merchant-ai-assist
          fi
