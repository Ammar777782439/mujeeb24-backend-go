name: Catalog LiteLLM gofmt (temporary)
on:
  push:
    branches:
      - feat/ai-litellm-multi-provider-gateway
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-litellm-multi-provider-gateway
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - name: Format stage 2 Go files
        run: |
          set -euo pipefail
          gofmt -w \
            internal/adapters/secondary/ai/litellm/token_counter*.go \
            internal/adapters/secondary/ai/gemini/litellm_catalog_adapter*.go \
            internal/adapters/secondary/ai/gemini/litellm_response.go \
            internal/platform/config/config.go \
            internal/bootstrap/integrations.go \
            internal/bootstrap/api.go \
            internal/application/services/catalog_batch_controller.go
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style(ai): gofmt LiteLLM full-catalog migration files'
          git push origin HEAD:feat/ai-litellm-multi-provider-gateway
