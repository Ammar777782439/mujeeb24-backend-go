name: Format Go once

on:
  push:
    branches:
      - refactor/merchant-catalog-ai-v2-structure

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"
          cache: true
      - name: Gofmt tracked Go files
        run: |
          set -euo pipefail
          files="$(git ls-files '*.go')"
          test -n "$files"
          gofmt -w $files
          if git diff --quiet --exit-code -- '*.go'; then
            echo "Go files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.go'
          git commit -m "chore: normalize gofmt"
          git push
