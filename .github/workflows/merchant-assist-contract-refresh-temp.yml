name: Temporary merchant AI Assist OpenAPI refresh
on:
  push:
    branches: [feat/merchant-ai-assist]
    paths: ['.github/workflows/merchant-assist-contract-refresh-temp.yml']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/merchant-ai-assist
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          set -euo pipefail
          go run ./cmd/openapi-gen
          gofmt -w internal/adapters/primary/http/contract/api_test.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add api/openapi/mujeeb24-dashboard-v1.generated.yaml internal/adapters/primary/http/contract/api_test.go
          if ! git diff --cached --quiet; then
            git commit -m 'docs(ai-assist): regenerate authenticated read-only API contract'
            git push origin HEAD:feat/merchant-ai-assist
          fi
