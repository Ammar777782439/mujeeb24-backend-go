name: Native AI Contracts
on:
  push:
    branches:
      - refactor/provider-agnostic-ai-runtime
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'scripts/**'
      - 'api/openapi/**'
      - 'migrations/**'
      - '.env.example'
      - 'deploy/local/.env.example'
      - 'render.yaml'
      - 'docs/architecture/provider-agnostic-ai-runtime.md'
      - '.github/workflows/native-ai-verify.yml'
  workflow_dispatch:

concurrency:
  group: native-ai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/provider-agnostic-ai-runtime
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: true
      - name: Validate canonical Go formatting
        shell: bash
        run: |
          set -euo pipefail
          files="$(git ls-files '*.go' | xargs gofmt -l)"
          if [ -n "$files" ]; then
            echo "::error::Unformatted Go source:"
            printf '%s\n' "$files"
            exit 1
          fi
      - name: Compile repository
        run: go build ./...
      - name: Test native provider routing
        run: go test -count=1 -race ./internal/adapters/secondary/ai/native/... ./internal/adapters/secondary/ai/gateway
      - name: Full Go tests
        run: go test ./...
      - name: Verify cross-package compilation
        run: go vet ./...

  sales-postgres-contract:
    name: Sales workflow PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mujeeb24_test
          POSTGRES_USER: mujeeb_test
          POSTGRES_PASSWORD: local-ci-only-password
        options: >-
          --health-cmd "pg_isready -U mujeeb_test -d mujeeb24_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      GOTOOLCHAIN: local
      POSTGRES_TEST_DSN: postgresql://mujeeb_test:local-ci-only-password@localhost:5432/mujeeb24_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/provider-agnostic-ai-runtime
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: true
      - name: Lead to subscription draft, update, price, and confirmation
        run: go test -tags=integration -count=1 -run '^TestSalesWorkflowLeadToPartialSubscriptionToConfirmedReadyAgainstPostgres$' ./internal/adapters/secondary/persistence/postgres
