name: Native AI Contracts
on:
  push:
    branches:
      - feat/gemini-deepseek
    paths:
      - 'internal/adapters/secondary/ai/native/**'
      - '.github/workflows/native-ai-verify.yml'
  workflow_dispatch:

concurrency:
  group: native-ai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  native-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gemini-deepseek
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: true
      - name: Canonical Go format
        run: gofmt -w internal/adapters/secondary/ai/native/*.go
      - name: Compile repository
        run: go build ./...
      - name: Test native provider routing
        run: go test -count=1 -race ./internal/adapters/secondary/ai/native/...
      - name: Verify cross-package compilation
        run: go vet ./...
      - name: Commit generated formatting back to feature branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- internal/adapters/secondary/ai/native/; then
            echo "Formatting already canonical"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/adapters/secondary/ai/native/
          git commit -m 'style(ai): gofmt native provider source and tests'
          git push origin HEAD:feat/gemini-deepseek
