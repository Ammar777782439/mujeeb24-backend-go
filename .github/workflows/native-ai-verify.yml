name: Native AI Contracts
on:
  push:
    branches:
      - feat/gemini-deepseek
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'scripts/**'
      - 'api/openapi/**'
      - 'migrations/**'
      - '.env.example'
      - 'render.yaml'
      - '.github/workflows/native-ai-verify.yml'
  workflow_dispatch:

concurrency:
  group: native-ai-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gemini-deepseek
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: true
      - name: Canonical Go format
        run: gofmt -w internal/adapters/secondary/ai/native/*.go internal/adapters/secondary/ai/gateway/native_*_adapter*.go
      - name: Compile repository
        run: go build ./...
      - name: Test native provider routing
        run: go test -count=1 -race ./internal/adapters/secondary/ai/native/... ./internal/adapters/secondary/ai/gateway
      - name: Full Go tests
        run: go test ./...
      - name: Verify cross-package compilation
        run: go vet ./...
