name: Format merchant AI assist contract files
on:
  push:
    branches: [feat/merchant-ai-assist]
    paths:
      - 'internal/domain/ai/contracts/**'
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/merchant-ai-assist
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - name: Apply gofmt to owned files only
        run: |
          set -euo pipefail
          gofmt -w internal/domain/ai/contracts/*.go
          if git diff --quiet -- internal/domain/ai/contracts; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/domain/ai/contracts/*.go
          git commit -m 'style(ai-assist): apply canonical gofmt'
          git push origin HEAD:feat/merchant-ai-assist
