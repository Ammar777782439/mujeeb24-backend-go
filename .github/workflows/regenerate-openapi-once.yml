name: Regenerate OpenAPI once

on:
  push:
    branches:
      - refactor/merchant-catalog-ai-v2-structure

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refactor/merchant-catalog-ai-v2-structure

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"
          cache: true

      - name: Regenerate generated OpenAPI
        run: ./scripts/generate-openapi.sh

      - name: Commit generated contract and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/openapi/mujeeb24-dashboard-v1.generated.yaml
          git rm -f .github/workflows/regenerate-openapi-once.yml
          git commit -m "chore(openapi): regenerate dashboard contract"
          git push origin HEAD:refactor/merchant-catalog-ai-v2-structure
