name: Real DeepSeek Context Validation

# Real API calls can consume provider balance. Never run automatically on push.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepseek-context-live-${{ github.ref }}
  cancel-in-progress: false

jobs:
  real-deepseek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      MUJEEB_PROVIDER_CONTEXT_LIVE: '1'
      MUJEEB_LIVE_PROVIDER: deepseek
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/provider-agnostic-ai-runtime
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: true
      - name: Require real DeepSeek credential
        shell: bash
        run: |
          if [[ -z "$DEEPSEEK_API_KEY" ]]; then
            echo "::error::DEEPSEEK_API_KEY secret missing; no live validation performed"
            exit 1
          fi
      - name: Run real DeepSeek capability and summary checks
        run: go test -tags=provider_live -v -count=1 -run '^TestNativeProviderContextLive$' -timeout=13m ./internal/adapters/secondary/ai/gateway
