name: One-time stateless AI and catalog formatting
on:
  push:
    branches:
      - feat/ai-litellm-multi-provider-gateway
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format affected Go sources
        run: |
          gofmt -w \
            internal/application/ports/customer_sales_contract.go \
            internal/application/ports/customer_sales_context.go \
            internal/application/services/ai_context_builder.go \
            internal/application/services/auto_reply.go \
            internal/application/services/fake_customer_sales_decision_port_test.go \
            internal/application/services/item4_item8_test.go \
            internal/application/services/catalog_batch_controller.go \
            internal/application/services/catalog_batch_controller_test.go \
            internal/application/services/catalog_batch_capacity_test.go \
            internal/application/services/catalog_batch_coverage_test.go \
            internal/application/services/catalog_batch_revision_test.go \
            internal/application/services/catalog_hierarchy.go \
            internal/application/services/catalog_hierarchy_test.go \
            internal/application/services/catalog_overview.go \
            internal/application/services/catalog_overview_test.go \
            internal/application/services/auto_reply_capabilities_test.go \
            internal/bootstrap/api.go \
            internal/adapters/secondary/ai/gateway/litellm_catalog_adapter.go \
            internal/adapters/secondary/ai/gateway/litellm_customer_adapter.go
      - name: Commit formatting to feature branch
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(ai): gofmt stateless catalog cleanup"
            git fetch origin feat/ai-litellm-multi-provider-gateway
            git rebase origin/feat/ai-litellm-multi-provider-gateway
            git push origin HEAD:feat/ai-litellm-multi-provider-gateway
          fi
