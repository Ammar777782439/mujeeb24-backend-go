name: Temporary integration test formatting

on:
  push:
    branches:
      - refactor/merchant-catalog-ai-v2-structure

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/merchant-catalog-ai-v2-structure
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -w internal/adapters/secondary/persistence/postgres/ai_audit_repository_integration_test.go
      - run: |
          if git diff --quiet -- internal/adapters/secondary/persistence/postgres/ai_audit_repository_integration_test.go; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/adapters/secondary/persistence/postgres/ai_audit_repository_integration_test.go
          git commit -m "style: gofmt AI audit integration test"
          git push origin HEAD:refactor/merchant-catalog-ai-v2-structure
