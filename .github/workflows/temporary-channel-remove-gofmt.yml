name: Temporary gofmt for channel removal tests
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/application/services/channel_runtime_disconnect_test.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/application/services/channel_runtime_disconnect_test.go
          if ! git diff --cached --quiet; then
            git commit -m "style(channels): gofmt channel removal regression tests"
            git push origin HEAD:main
          fi
