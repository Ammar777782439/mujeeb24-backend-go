name: Temporary Merchant AI History Formatter
on:
  push:
    branches: [feat/merchant-ai-assist]
    paths:
      - '.github/workflows/merchant-assist-history-gofmt-temp.yml'
      - 'internal/application/merchantassist/conversation_history_reader*.go'
permissions:
  contents: write
jobs:
  gofmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/merchant-ai-assist
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - name: Apply gofmt only to P3-C files
        run: |
          set -euo pipefail
          gofmt -w internal/application/merchantassist/conversation_history_reader.go internal/application/merchantassist/conversation_history_reader_test.go
          if git diff --quiet -- internal/application/merchantassist/conversation_history_reader.go internal/application/merchantassist/conversation_history_reader_test.go; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/application/merchantassist/conversation_history_reader.go internal/application/merchantassist/conversation_history_reader_test.go
          git commit -m 'style(ai-assist): gofmt P3-C history reader'
          git push origin HEAD:feat/merchant-ai-assist
