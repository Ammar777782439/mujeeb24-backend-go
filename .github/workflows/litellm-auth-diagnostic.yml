name: LiteLLM authorization diagnostic (no model calls)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-diagnostic:
    name: Compare public model listing authorization without inference
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify key exists without showing it
        run: |
          if [[ -z "${LITELLM_API_KEY}" ]]; then
            echo "::error::Missing encrypted secret LITELLM_API_KEY"
            exit 1
          fi
      - name: Inspect sanitized 403 classification using real HTTPS
        run: python3 scripts/diagnose-litellm-auth.py
