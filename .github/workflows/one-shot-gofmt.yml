name: Temporary sales continuation gofmt
on:
  push:
    branches:
      - feat/customer-sales-start-consent
permissions:
  contents: write
jobs:
  gofmt:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-sales-start-consent
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - name: Format phase-2 Go changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACM c9f654583aea18779d6df038479028998b193cc2 HEAD -- '*.go')
          if (( ${#files[@]} == 0 )); then exit 0; fi
          gofmt -w "${files[@]}"
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "chore(sales): format durable continuation code"
          git push origin HEAD:feat/customer-sales-start-consent
