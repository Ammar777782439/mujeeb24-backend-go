name: Temporary sales handoff gofmt

on:
  push:
    branches:
      - feat/customer-sales-start-consent

permissions:
  contents: write

jobs:
  gofmt:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-sales-start-consent
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            internal/adapters/secondary/persistence/postgres/sales_action_jobs.go \
            internal/application/services/sales_action_processor_handoff_test.go
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            internal/adapters/secondary/persistence/postgres/sales_action_jobs.go \
            internal/application/services/sales_action_processor_handoff_test.go
          git commit -m "chore(sales): format human handoff regression fix"
          git push origin HEAD:feat/customer-sales-start-consent
