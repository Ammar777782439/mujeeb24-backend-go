name: Temporary sales start consent gofmt

on:
  push:
    branches:
      - feat/customer-sales-start-consent

permissions:
  contents: write

jobs:
  gofmt:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out sales consent branch
        uses: actions/checkout@v4
        with:
          ref: feat/customer-sales-start-consent
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - name: Format consent implementation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACM 956965db57fb00ae91b8ec847ec9ec24170e9f3a HEAD -- '*.go')
          (( ${#files[@]} > 0 )) || exit 0
          gofmt -w "${files[@]}"
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}"
          git commit -m "chore(sales): format customer sales start consent implementation"
          git push origin HEAD:feat/customer-sales-start-consent
