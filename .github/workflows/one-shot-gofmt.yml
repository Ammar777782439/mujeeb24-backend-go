name: One-shot gofmt

on:
  push:
    branches:
      - feat/universal-catalog-ai-v3

permissions:
  contents: write

jobs:
  gofmt:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feat/universal-catalog-ai-v3
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - name: Format files reported by quality gate
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            internal/adapters/primary/http/dto/inputs.go \
            internal/adapters/primary/http/handlers/command_facades.go \
            internal/adapters/primary/http/handlers/merchant_catalog_ai_v2_handler.go \
            internal/adapters/secondary/ai/gemini/merchant_catalog_schema.go \
            internal/application/catalogvalidation/attributes_test.go \
            internal/application/commands/customers_catalog.go \
            internal/application/merchantcatalogai/execution.go \
            internal/application/merchantcatalogai/execution_test.go \
            internal/application/merchantcatalogai/proposal.go \
            internal/application/ports/catalog_repository.go \
            internal/application/services/catalog_commands.go \
            internal/application/services/catalog_item_atomic_test.go \
            internal/application/services/catalog_item_update_test.go
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            internal/adapters/primary/http/dto/inputs.go \
            internal/adapters/primary/http/handlers/command_facades.go \
            internal/adapters/primary/http/handlers/merchant_catalog_ai_v2_handler.go \
            internal/adapters/secondary/ai/gemini/merchant_catalog_schema.go \
            internal/application/catalogvalidation/attributes_test.go \
            internal/application/commands/customers_catalog.go \
            internal/application/merchantcatalogai/execution.go \
            internal/application/merchantcatalogai/execution_test.go \
            internal/application/merchantcatalogai/proposal.go \
            internal/application/ports/catalog_repository.go \
            internal/application/services/catalog_commands.go \
            internal/application/services/catalog_item_atomic_test.go \
            internal/application/services/catalog_item_update_test.go
          git commit -m "chore: apply gofmt"
          git push origin HEAD:feat/universal-catalog-ai-v3
