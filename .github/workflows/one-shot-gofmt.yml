name: Temporary durable continuation gofmt
on:
  push:
    branches:
      - feat/customer-sales-start-consent
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/customer-sales-start-consent
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/application/services/sales_action_processor.go internal/bootstrap/worker.go internal/application/services/sales_action_continuation_test.go
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/application/services/sales_action_processor.go internal/bootstrap/worker.go internal/application/services/sales_action_continuation_test.go
          git commit -m "chore(sales): format entitlement guard tests"
          git push origin HEAD:feat/customer-sales-start-consent
