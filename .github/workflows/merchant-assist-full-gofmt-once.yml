name: Temporary merchant AI Assist full formatting
on:
  push:
    branches: [feat/merchant-ai-assist]
    paths:
      - '.github/workflows/merchant-assist-full-gofmt-once.yml'
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/merchant-ai-assist
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - name: Canonical gofmt for merchant AI Assist files
        run: |
          set -euo pipefail
          gofmt -w internal/application/merchantassist/*.go internal/domain/ai/contracts/{merchant_registry*,qualification*}.go internal/adapters/secondary/ai/gateway/merchant_assist_completion.go internal/adapters/primary/http/{dto,contract}/merchant_assist.go internal/adapters/primary/http/handlers/core.go internal/bootstrap/{api,integrations}.go
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/application/merchantassist internal/domain/ai/contracts/merchant_registry* internal/domain/ai/contracts/qualification* internal/adapters/secondary/ai/gateway/merchant_assist_completion.go internal/adapters/primary/http/dto/merchant_assist.go internal/adapters/primary/http/contract/merchant_assist.go internal/adapters/primary/http/handlers/core.go internal/bootstrap/api.go internal/bootstrap/integrations.go
          git commit -m 'style(ai-assist): gofmt unified merchant AI implementation'
          git push origin HEAD:feat/merchant-ai-assist
