name: Temporary PostgreSQL 16 schema snapshot capture

on:
  push:
    branches:
      - feat/conversation-media-attachments

permissions:
  contents: read

jobs:
  capture-reviewed-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mujeeb24_test
          POSTGRES_USER: mujeeb_test
          POSTGRES_PASSWORD: local-ci-only-password
        options: >-
          --health-cmd "pg_isready -U mujeeb_test -d mujeeb24_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      GOTOOLCHAIN: local
      POSTGRES_TEST_DSN: postgresql://mujeeb_test:local-ci-only-password@localhost:5432/mujeeb24_test?sslmode=disable
      MERCHANT_ASSIST_SCHEMA_RECORD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"
          cache: true
      - name: Capture exact migrated PostgreSQL schema metadata
        run: go test -v -tags=integration -count=1 -run '^TestMerchantAssistSchemaAfterAllMigrations$' ./internal/platform/database
