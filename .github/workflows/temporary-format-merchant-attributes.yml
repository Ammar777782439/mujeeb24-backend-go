name: Temporary formatting of merchant attribute extension
on:
  push:
    branches:
      - fix/merchant-catalog-strict-wire-v3
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/merchant-catalog-strict-wire-v3
          persist-credentials: true
      - name: Format touched Go files and push
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w \
            internal/application/merchantcatalogai/proposal.go \
            internal/application/merchantcatalogai/proposal_validation.go \
            internal/application/merchantcatalogai/proposal_normalization.go \
            internal/application/merchantcatalogai/attribute_definition_validation.go \
            internal/application/merchantcatalogai/attribute_schema_materialization.go \
            internal/application/merchantcatalogai/attribute_schema_materialization_test.go \
            internal/application/ports/catalog_repository.go \
            internal/adapters/secondary/persistence/postgres/catalog_repository.go \
            internal/adapters/secondary/ai/gateway/merchant_catalog_wire.go \
            internal/adapters/secondary/ai/gateway/merchant_catalog_wire_test.go \
            internal/adapters/secondary/ai/gateway/merchant_catalog_schema.go \
            internal/adapters/secondary/ai/gateway/native_merchant_catalog_adapter.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "style(merchant-ai): gofmt attribute definitions and schema extension"
            git push origin HEAD:fix/merchant-catalog-strict-wire-v3
          fi
