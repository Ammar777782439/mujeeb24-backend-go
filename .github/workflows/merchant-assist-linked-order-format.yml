name: Merchant Assist verified order formatting
on:
  push:
    branches: [feat/merchant-ai-assist]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format verified-order read and tests
        run: |
          gofmt -w internal/application/merchantassist/assistant_chat.go
          gofmt -w internal/application/merchantassist/discovery_reader.go
          gofmt -w internal/application/merchantassist/tool_contract.go
          gofmt -w internal/application/merchantassist/transaction_customer_details_test.go
          gofmt -w internal/bootstrap/api.go
          git diff --check
          git add internal/application/merchantassist/assistant_chat.go internal/application/merchantassist/discovery_reader.go internal/application/merchantassist/tool_contract.go internal/application/merchantassist/transaction_customer_details_test.go internal/bootstrap/api.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(merchant-assist): gofmt linked order/customer tool'
            git push origin HEAD:feat/merchant-ai-assist
          fi
