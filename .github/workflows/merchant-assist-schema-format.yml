name: Format Merchant Assist strict tool schema fix
on:
  push:
    branches: [feat/merchant-ai-assist]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical formatting for merchant strict tool changes
        run: |
          gofmt -w internal/application/merchantassist/tool_contract.go
          gofmt -w internal/application/merchantassist/tool_contract_test.go
          gofmt -w internal/adapters/secondary/ai/gateway/merchant_assist_deepseek_contract_test.go
          gofmt -w internal/adapters/secondary/ai/native/deepseek.go
          git diff --check
          git add internal/application/merchantassist/tool_contract.go internal/application/merchantassist/tool_contract_test.go internal/adapters/secondary/ai/gateway/merchant_assist_deepseek_contract_test.go internal/adapters/secondary/ai/native/deepseek.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(merchant-assist): gofmt strict tool schema regression tests'
            git push origin HEAD:feat/merchant-ai-assist
          fi
