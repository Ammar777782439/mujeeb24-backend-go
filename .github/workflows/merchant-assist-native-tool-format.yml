name: Format Merchant Assist native tools
on:
  push:
    branches: [feat/merchant-ai-assist]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Canonical Go formatting
        run: |
          gofmt -w internal/application/merchantassist/assistant.go
          gofmt -w internal/application/merchantassist/assistant_chat.go
          gofmt -w internal/application/merchantassist/assistant_chat_test.go
          gofmt -w internal/application/merchantassist/assistant_customer_activity_test.go
          gofmt -w internal/application/merchantassist/tool_contract.go
          gofmt -w internal/adapters/secondary/ai/gateway/merchant_assist_native_tools.go
          gofmt -w internal/bootstrap/api.go
          git diff --check
          git add internal/application/merchantassist internal/adapters/secondary/ai/gateway/merchant_assist_native_tools.go internal/bootstrap/api.go
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(merchant-assist): gofmt native tool calling runtime and tests"
            git push origin HEAD:feat/merchant-ai-assist
          fi
