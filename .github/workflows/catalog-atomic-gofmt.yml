name: Format atomic catalog change

on:
  push:
    branches:
      - feat/catalog-complete-commercial-entity-atomic
    paths:
      - 'internal/application/services/*.go'
      - 'scripts/litellm-go-edge-probe/main.go'
      - 'scripts/litellm-go-catalog-live/main.go'
      - 'internal/adapters/secondary/persistence/postgres/ai_context_builder_integration_test.go'

permissions:
  contents: write

jobs:
  gofmt:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/catalog-complete-commercial-entity-atomic
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - name: Apply gofmt to touched catalog files
        run: |
          set -euo pipefail
          gofmt -w internal/application/services/catalog_ai_projection.go \
            internal/application/services/catalog_ai_runtime.go \
            internal/application/services/catalog_semantic_projection.go \
            internal/application/services/catalog_batch_controller.go \
            internal/application/services/catalog_batch_coverage.go \
            internal/application/services/catalog_batch_controller_test.go \
            internal/application/services/catalog_batch_coverage_test.go \
            internal/application/services/catalog_semantic_projection_test.go \
            internal/application/services/catalog_hierarchy.go \
            internal/application/services/ai_context_retrieval.go \
            internal/application/services/auto_reply_capabilities_test.go \
            internal/adapters/secondary/persistence/postgres/ai_context_builder_integration_test.go \
            scripts/litellm-go-edge-probe/main.go \
            scripts/litellm-go-catalog-live/main.go
          if git diff --quiet; then
            echo 'All Go files already formatted'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/application/services/ internal/adapters/secondary/persistence/postgres/ai_context_builder_integration_test.go scripts/litellm-go-edge-probe/main.go scripts/litellm-go-catalog-live/main.go
          git commit -m 'chore(catalog): apply gofmt to atomic entity change'
          for attempt in 1 2 3 4 5; do
            # GitHub integration commits may race with this formatting job.
            # Rebase the pure gofmt commit to current feature head before push.
            git fetch origin feat/catalog-complete-commercial-entity-atomic
            git rebase origin/feat/catalog-complete-commercial-entity-atomic
            if git push origin HEAD:feat/catalog-complete-commercial-entity-atomic; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Failed to push formatting commit after retries"
          exit 1
