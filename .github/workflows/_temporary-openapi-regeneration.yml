name: Temporary OpenAPI regeneration

on:
  push:
    branches:
      - refactor/merchant-catalog-ai-v2-structure

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/merchant-catalog-ai-v2-structure

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Regenerate dashboard OpenAPI
        run: go run ./cmd/openapi-gen

      - name: Commit generated contract
        run: |
          if git diff --quiet -- api/openapi/mujeeb24-dashboard-v1.generated.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/openapi/mujeeb24-dashboard-v1.generated.yaml
          git commit -m "chore(api): regenerate dashboard OpenAPI contract"
          git push origin HEAD:refactor/merchant-catalog-ai-v2-structure
