name: Media branch contract reconcile
on:
  push:
    branches: [feat/catalog-media-mvp-backend]
    paths: ['.github/workflows/catalog-media-reconcile.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/catalog-media-mvp-backend
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: true
      - name: Format and generate canonical OpenAPI
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/adapters/primary/http/contract/catalog_media.go
          bash scripts/generate-openapi.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/adapters/primary/http/contract/catalog_media.go api/openapi/mujeeb24-dashboard-v1.generated.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(media): format upload contract and regenerate OpenAPI'
          git push origin HEAD:feat/catalog-media-mvp-backend
