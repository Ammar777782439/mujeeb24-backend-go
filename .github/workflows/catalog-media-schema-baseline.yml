name: Catalog Media PostgreSQL schema baseline
on:
  push:
    branches:
      - feat/catalog-media-mvp-backend
    paths:
      - '.github/workflows/catalog-media-schema-baseline.yml'
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mujeeb24_test
          POSTGRES_USER: mujeeb_test
          POSTGRES_PASSWORD: local-ci-only-password
        options: >-
          --health-cmd "pg_isready -U mujeeb_test -d mujeeb24_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports: ['5432:5432']
    env:
      GOTOOLCHAIN: local
      RUN_INTEGRATION: '1'
      POSTGRES_TEST_DSN: postgresql://mujeeb_test:local-ci-only-password@localhost:5432/mujeeb24_test?sslmode=disable
      MERCHANT_ASSIST_SCHEMA_RECORD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: true
      - name: Capture PostgreSQL schema metadata and commit reviewed source snapshot
        shell: bash
        run: |
          set -euo pipefail
          go test -tags=integration -count=1 -v -run '^TestMerchantAssistSchemaAfterAllMigrations$' ./internal/platform/database | tee /tmp/media-schema-audit.log
          awk '/ASSIST_SCHEMA_SNAPSHOT_START/{f=1;next}/ASSIST_SCHEMA_SNAPSHOT_END/{f=0} f' /tmp/media-schema-audit.log > /tmp/catalog-media-schema.json
          test -s /tmp/catalog-media-schema.json
          cp /tmp/catalog-media-schema.json internal/platform/database/testdata/merchant_assist_schema_pg16.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/platform/database/testdata/merchant_assist_schema_pg16.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(media): capture PG16 schema snapshot for migration 000083'
          git push origin HEAD:feat/catalog-media-mvp-backend
