name: Quality gate

on:
  pull_request:
  push:
    branches:
      - main
      - refactor/merchant-catalog-ai-v2-structure
      - feat/universal-catalog-ai-v3
      - feat/customer-sales-workflow-interactive
      - feat/catalog-complete-commercial-entity-atomic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Go, contract, secrets, and PostgreSQL integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mujeeb24_test
          POSTGRES_USER: mujeeb_test
          POSTGRES_PASSWORD: local-ci-only-password
        options: >-
          --health-cmd "pg_isready -U mujeeb_test -d mujeeb24_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      GOTOOLCHAIN: local
      RUN_INTEGRATION: "1"
      POSTGRES_TEST_DSN: postgresql://mujeeb_test:local-ci-only-password@localhost:5432/mujeeb24_test?sslmode=disable
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"
          cache: true
      - name: Verify provider smoke script Python syntax
        run: python3 -m py_compile scripts/test-litellm-live-catalog.py
      - name: Verify repository contract
        run: bash scripts/verify-repository.sh

  lite-llm-edge:
    name: Public LiteLLM HTTPS endpoint (unauthenticated, feature branch only)
    if: github.head_ref == 'feat/catalog-complete-commercial-entity-atomic' || github.ref_name == 'feat/catalog-complete-commercial-entity-atomic'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Identify the actual public gateway route without secrets
        shell: bash
        run: |
          set -euo pipefail
          base='https://webhook.mujeeb24.com'
          echo "HTTPS endpoint: ${base}"
          ready="$(curl --silent --show-error --max-redirs 0 --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' "${base}/health/readiness")" || ready=000
          models="$(curl --silent --show-error --max-redirs 0 --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' "${base}/v1/models")" || models=000
          echo "GET /health/readiness: HTTP ${ready}"
          echo "GET /v1/models without key: HTTP ${models}"
          if [[ "${ready}" == 200 || "${models}" == 401 || "${models}" == 200 ]]; then
            echo 'Public LiteLLM route detected; no AI model/authenticated request has been verified.'
          else
            echo "::error::Public LiteLLM route not confirmed (Cloudflare, Caddy or origin routing)."
            exit 1
          fi
