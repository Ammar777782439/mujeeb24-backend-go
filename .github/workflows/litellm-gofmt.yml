name: LiteLLM migration gofmt (temporary)
on:
  push:
    branches:
      - feat/ai-litellm-multi-provider-gateway
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-litellm-multi-provider-gateway
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - name: Format migration Go files
        run: |
          set -euo pipefail
          gofmt -w \
            internal/adapters/secondary/ai/litellm/*.go \
            internal/adapters/secondary/ai/gemini/litellm_customer_adapter*.go \
            internal/adapters/secondary/ai/gemini/customer_sales_http_error.go \
            internal/adapters/secondary/ai/gemini/customer_sales_adapter.go \
            internal/application/services/customer_sales_failover*.go \
            internal/application/services/ai_usage_provider.go \
            internal/application/services/auto_reply.go \
            internal/application/services/conversation_summary_service.go \
            internal/application/ports/customer_sales_contract.go \
            internal/bootstrap/integrations.go \
            internal/bootstrap/api.go \
            internal/platform/config/config.go
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style(ai): gofmt LiteLLM migration files'
          git push origin HEAD:feat/ai-litellm-multi-provider-gateway
