name: LiteLLM gateway-only one-shot formatter
on:
  push:
    branches:
      - feat/ai-litellm-multi-provider-gateway
permissions:
  contents: write
jobs:
  format:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ai-litellm-multi-provider-gateway
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - name: Format gateway-only migration
        run: |
          set -euo pipefail
          gofmt -w \
            internal/platform/config/config.go \
            internal/platform/config/litellm_gateway_only_test.go \
            internal/bootstrap/integrations.go \
            internal/bootstrap/litellm_gateway_only_test.go \
            internal/bootstrap/api.go
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m 'style(ai): gofmt gateway-only configuration and tests'
          git push origin HEAD:feat/ai-litellm-multi-provider-gateway
