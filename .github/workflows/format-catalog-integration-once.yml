name: Format catalog integration fixtures once
on:
  push:
    branches: [feat/universal-catalog-ai-v3]
    paths: [.github/workflows/format-catalog-integration-once.yml]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format the updated test fixtures
        run: |
          gofmt -w internal/adapters/secondary/persistence/postgres/ai_context_builder_integration_test.go
          gofmt -w internal/adapters/secondary/persistence/postgres/business_repository_integration_test.go
      - name: Commit format
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/adapters/secondary/persistence/postgres/ai_context_builder_integration_test.go internal/adapters/secondary/persistence/postgres/business_repository_integration_test.go
          if ! git diff --cached --quiet; then
            git commit -m 'style: gofmt updated PostgreSQL integration fixtures'
            git push origin HEAD:feat/universal-catalog-ai-v3
          fi
