name: Format Merchant Assist partial history recovery
on:
  push:
    branches: [feat/merchant-ai-assist]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply standard Go formatting
        run: |
          gofmt -w internal/application/merchantassist/assistant_chat.go
          gofmt -w internal/application/merchantassist/conversation_history_reader.go
          gofmt -w internal/application/merchantassist/conversation_history_reader_test.go
          gofmt -w internal/application/merchantassist/tool_recovery.go
          gofmt -w internal/application/merchantassist/assistant_tool_recovery_test.go
          git diff --check
          git add internal/application/merchantassist/assistant_chat.go internal/application/merchantassist/conversation_history_reader.go internal/application/merchantassist/conversation_history_reader_test.go internal/application/merchantassist/tool_recovery.go internal/application/merchantassist/assistant_tool_recovery_test.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(merchant-assist): gofmt bounded history and source recovery'
            git push origin HEAD:feat/merchant-ai-assist
          fi
