name: Render image verification

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - "render.yaml"
  push:
    branches:
      - main
      - refactor/merchant-catalog-ai-v2-structure
    paths:
      - "Dockerfile"
      - "cmd/**"
      - "internal/**"
      - "migrations/**"
      - "go.mod"
      - "go.sum"
      - "render.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    name: Verify production Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Mujeeb runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mujeeb24/runtime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
