name: Format merchant assist recovery changes
on:
  push:
    branches: [feat/merchant-ai-assist]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format recovery implementation and tests
        run: |
          gofmt -w internal/application/merchantassist/assistant_chat.go
          gofmt -w internal/application/merchantassist/tool_recovery.go
          gofmt -w internal/application/merchantassist/assistant_tool_recovery_test.go
          gofmt -w internal/application/merchantassist/assistant_chat_test.go
          gofmt -w internal/application/merchantassist/assistant_customer_activity_test.go
          gofmt -w internal/application/merchantassist/assistant_multi_tool_test.go
          git diff --check
          git add internal/application/merchantassist/assistant_chat.go internal/application/merchantassist/tool_recovery.go internal/application/merchantassist/assistant_tool_recovery_test.go internal/application/merchantassist/assistant_chat_test.go internal/application/merchantassist/assistant_customer_activity_test.go internal/application/merchantassist/assistant_multi_tool_test.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(merchant-assist): gofmt recoverable native read flow'
            git push origin HEAD:feat/merchant-ai-assist
          fi
