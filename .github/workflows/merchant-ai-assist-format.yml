name: Merchant AI Assist Go formatting
on:
  push:
    branches:
      - feat/merchant-ai-assist
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Format merchant assist sources
        run: |
          gofmt -w internal/application/merchantassist/discovery_reader.go
          gofmt -w internal/application/merchantassist/assistant_chat.go
          gofmt -w internal/application/merchantassist/assistant_chat_test.go
          gofmt -w internal/application/merchantassist/assistant.go
          gofmt -w internal/domain/ai/contracts/merchant_registry.go
          gofmt -w internal/adapters/primary/http/handlers/merchant_assist_errors.go
          gofmt -w internal/bootstrap/api.go
          git diff --check
          git add internal/application/merchantassist internal/domain/ai/contracts/merchant_registry.go internal/adapters/primary/http/handlers/merchant_assist_errors.go internal/bootstrap/api.go
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(merchant-assist): gofmt new conversational runtime"
            git push origin HEAD:feat/merchant-ai-assist
          fi
