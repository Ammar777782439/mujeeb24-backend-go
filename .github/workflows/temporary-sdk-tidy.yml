name: Temporary SDK dependency reconciliation

on:
  push:
    branches:
      - integration/catalog-media-main

permissions:
  contents: write

jobs:
  sdk-tidy:
    if: github.repository == 'Ammar777782439/mujeeb24-backend-go'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"
          cache: false
      - name: Resolve pinned AWS SDK modules and format only migrated client
        run: |
          set -euo pipefail
          go mod tidy
          gofmt -w internal/adapters/secondary/storage/r2/client.go internal/adapters/secondary/storage/r2/client_test.go
          git diff --check
          git add go.mod go.sum internal/adapters/secondary/storage/r2/client.go internal/adapters/secondary/storage/r2/client_test.go
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(s3): reconcile official AWS SDK module checksums and gofmt'
            git push origin HEAD:refs/heads/integration/catalog-media-main
          fi
