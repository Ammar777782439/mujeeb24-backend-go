name: Media branch format and API reconciliation
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/catalog-media-mvp-backend
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
          cache: true
      - name: Reconcile all changed Go files and OpenAPI on feature branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -z origin/main...HEAD -- '*.go' | xargs -0 -r gofmt -w
          bash scripts/generate-openapi.sh
          git config user.name github-actions\[bot\]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(media): reconcile Go and OpenAPI'
          git push origin HEAD:feat/catalog-media-mvp-backend
