name: Format merchant guide
on:
  push:
    branches: [feat/merchant-ai-assist]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format guide code
        run: |
          gofmt -w internal/application/merchantassist/tool_contract.go
          gofmt -w internal/application/merchantassist/discovery_reader.go
          gofmt -w internal/application/merchantassist/platform_guide_test.go
          git diff --check
          git add internal/application/merchantassist/tool_contract.go internal/application/merchantassist/discovery_reader.go internal/application/merchantassist/platform_guide_test.go
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(merchant-assist): format read-only platform guidance"
            git push origin HEAD:feat/merchant-ai-assist
          fi
