name: Temporary Media Go Formatter
on:
  push:
    branches: [feat/catalog-media-mvp-backend]
    paths: [.github/workflows/media-gofmt-temp.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - name: gofmt changed files
        run: |
          gofmt -w internal/adapters/primary/http/dto/inputs.go internal/application/commands/customers_catalog.go internal/application/services/catalog_commands.go
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/adapters/primary/http/dto/inputs.go internal/application/commands/customers_catalog.go internal/application/services/catalog_commands.go
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(media): gofmt catalog integration'
          git push origin HEAD:feat/catalog-media-mvp-backend
