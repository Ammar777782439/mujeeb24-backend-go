name: Temporary branch formatting

on:
  push:
    branches:
      - refactor/merchant-catalog-ai-v2-structure

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/merchant-catalog-ai-v2-structure

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format affected Go files
        run: |
          gofmt -w             internal/adapters/primary/http/handlers/platform_command_facade.go             internal/adapters/secondary/persistence/postgres/subscription_repository_integration_test.go             internal/application/services/channel_runtime_disconnect_test.go             internal/bootstrap/api.go

      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             internal/adapters/primary/http/handlers/platform_command_facade.go             internal/adapters/secondary/persistence/postgres/subscription_repository_integration_test.go             internal/application/services/channel_runtime_disconnect_test.go             internal/bootstrap/api.go
          git commit -m "style: gofmt affected production files"
          git push origin HEAD:refactor/merchant-catalog-ai-v2-structure
