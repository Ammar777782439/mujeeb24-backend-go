name: One-time Media Go formatting and OpenAPI reconciliation
on:
  push:
    branches: [feat/catalog-media-mvp-backend]
    paths: ['.github/workflows/media-build-sync.yml']
permissions:
  contents: write
jobs:
  format-and-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with: {go-version: '1.22.2', cache: true}
      - name: Format changed Go code and synchronize canonical OpenAPI
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only -z origin/main...HEAD -- '*.go' | xargs -0 -r gofmt -w
          bash scripts/generate-openapi.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style(media): gofmt all changed files and generate OpenAPI'
          git push origin HEAD:feat/catalog-media-mvp-backend
