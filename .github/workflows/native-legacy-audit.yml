name: Native AI Legacy Reference Audit
on:
  push:
    branches: [feat/gemini-deepseek]
    paths:
      - '.github/workflows/native-legacy-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate all old files and references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FILE PATHS CONTAINING LEGACY PROVIDER NAME ==='
          git ls-files | grep -i 'litellm' || true
          echo '=== SOURCE FILES WITH LEGACY REFERENCES ==='
          git grep -il -i 'litellm' -- ':!migrations/**' ':!.github/workflows/native-legacy-audit.yml' || true
          echo '=== REFERENCE COUNTS PER FILE ==='
          git grep -i -n 'litellm' -- ':!migrations/**' ':!.github/workflows/native-legacy-audit.yml' | cut -d: -f1 | sort | uniq -c | sort -k2 || true
          echo '=== CANDIDATE GO SOURCE IMPORTS ==='
          git grep -n 'adapters/secondary/ai/litellm' -- '*.go' || true
