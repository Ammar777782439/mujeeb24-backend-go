name: Native AI Legacy Reference Audit
on:
  push:
    branches: [feat/gemini-deepseek]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reject obsolete provider gateway paths and references
        shell: bash
        run: |
          set -euo pipefail
          # Compose obsolete identifier to avoid matching this audit source.
          identifier="$(printf '%s%s' lite llm)"
          if git ls-files | grep -i "${identifier}"; then
            echo "::error::Obsolete gateway-named files remain"
            exit 1
          fi
          if git grep -i -n "${identifier}" -- ':!.github/workflows/native-legacy-audit.yml'; then
            echo "::error::Obsolete gateway references remain"
            exit 1
          fi
          echo 'No obsolete gateway filenames or source references.'
