name: Temporary OpenAPI sync

on:
  push:
    branches:
      - feat/free-zero-cost-dockhosting

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.2"
          cache: true

      - name: Regenerate OpenAPI
        run: go run ./cmd/openapi-gen

      - name: Commit generated contract
        run: |
          set -euo pipefail
          if git diff --quiet -- api/openapi/mujeeb24-dashboard-v1.generated.yaml; then
            echo "OpenAPI contract is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/openapi/mujeeb24-dashboard-v1.generated.yaml
          git commit -m "chore: synchronize generated OpenAPI contract"
          git push
