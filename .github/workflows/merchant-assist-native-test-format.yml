name: Format merchant assist transport regression test
on:
  push:
    branches: [feat/merchant-ai-assist]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format native contract test
        run: |
          gofmt -w internal/adapters/secondary/ai/gateway/merchant_assist_native_tools_test.go
          git diff --check
          git add internal/adapters/secondary/ai/gateway/merchant_assist_native_tools_test.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(merchant-assist): gofmt native provider contract test'
            git push origin HEAD:feat/merchant-ai-assist
          fi
