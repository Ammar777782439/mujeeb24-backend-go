name: Format merchant answer contract
on:
  push:
    branches: [feat/merchant-ai-assist]
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format Arabic status contract and its tests
        run: |
          gofmt -w internal/application/merchantassist/merchant_answer_contract.go
          gofmt -w internal/application/merchantassist/merchant_answer_contract_test.go
          gofmt -w internal/application/merchantassist/assistant_chat.go
          gofmt -w internal/application/merchantassist/tool_contract.go
          git diff --check
          git add internal/application/merchantassist/merchant_answer_contract.go internal/application/merchantassist/merchant_answer_contract_test.go internal/application/merchantassist/assistant_chat.go internal/application/merchantassist/tool_contract.go
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'style(merchant-assist): gofmt Arabic merchant answer contracts'
            git push origin HEAD:feat/merchant-ai-assist
          fi
