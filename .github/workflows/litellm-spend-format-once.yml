name: Temporary LiteLLM spend formatting
on:
  push:
    branches:
      - feat/ai-litellm-multi-provider-gateway

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format new spend attribution files
        run: |
          gofmt -w internal/adapters/secondary/ai/litellm/attribution.go internal/adapters/secondary/ai/litellm/attribution_test.go
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(litellm): format native spend attribution"
            git push origin HEAD:feat/ai-litellm-multi-provider-gateway
          fi
