name: Catalog Media branch gofmt
on:
  push:
    branches:
      - feat/catalog-media-mvp-backend
    paths:
      - 'internal/application/ports/catalog_media.go'
      - 'internal/application/services/catalog_media_service.go'
      - 'internal/application/services/catalog_media_service_test.go'
      - 'internal/adapters/secondary/persistence/postgres/catalog_media_repository.go'
      - '.github/workflows/catalog-media-branch-gofmt.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.2'
      - name: Format branch-owned Go files
        run: |
          gofmt -w internal/application/ports/catalog_media.go \
            internal/application/services/catalog_media_service.go \
            internal/application/services/catalog_media_service_test.go \
            internal/adapters/secondary/persistence/postgres/catalog_media_repository.go
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/application/ports/catalog_media.go \
            internal/application/services/catalog_media_service.go \
            internal/application/services/catalog_media_service_test.go \
            internal/adapters/secondary/persistence/postgres/catalog_media_repository.go
          git commit -m 'style(media): gofmt branch-owned packages'
          git push origin HEAD:feat/catalog-media-mvp-backend
