name: Temporary LiteLLM Go formatting
on:
  push:
    branches:
      - feat/ai-litellm-multi-provider-gateway

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply gofmt to changed gateway accounting sources
        run: |
          gofmt -w \
            internal/adapters/secondary/ai/litellm/client.go \
            internal/adapters/secondary/ai/litellm/metadata.go \
            internal/adapters/secondary/ai/litellm/metadata_test.go \
            internal/adapters/secondary/ai/gemini/litellm_customer_adapter.go \
            internal/adapters/secondary/ai/gemini/litellm_catalog_adapter.go \
            internal/adapters/secondary/ai/gemini/litellm_catalog_overview.go \
            internal/adapters/secondary/ai/gemini/litellm_catalog_reply.go \
            internal/adapters/secondary/ai/gemini/litellm_merchant_catalog_adapter.go \
            internal/application/ports/ai_usage.go \
            internal/application/ports/customer_sales_contract.go \
            internal/application/ports/ai_provider_config.go \
            internal/application/services/gateway_native_spend.go \
            internal/application/services/gateway_merchant_usage.go \
            internal/application/services/auto_reply.go \
            internal/application/services/catalog_batch_controller.go \
            internal/application/services/conversation_summary_service.go \
            internal/bootstrap/api.go \
            internal/bootstrap/integrations.go \
            internal/bootstrap/merchant_catalog_ai.go \
            internal/platform/config/config.go
      - name: Commit formatting (no merge)
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(ai-billing): gofmt gateway native telemetry"
            git push origin HEAD:feat/ai-litellm-multi-provider-gateway
          fi
