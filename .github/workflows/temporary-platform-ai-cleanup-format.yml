name: One-time Platform Admin cleanup formatter
on:
  push:
    branches:
      - feat/ai-litellm-multi-provider-gateway
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run gofmt for the Platform Admin cleanup
        run: |
          gofmt -w \
            internal/adapters/primary/http/handlers/platform_command_facade.go \
            internal/application/ports/ai_provider_config.go \
            internal/application/ports/platform_operations.go \
            internal/application/services/platform_operations_service.go \
            internal/application/services/platform_operations_litellm_test.go \
            internal/bootstrap/api.go \
            internal/bootstrap/litellm_health_probe.go \
            internal/bootstrap/litellm_health_probe_test.go
      - name: Commit formatting
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style(platform-ai): format LiteLLM admin cleanup"
            git push origin HEAD:feat/ai-litellm-multi-provider-gateway
          fi
