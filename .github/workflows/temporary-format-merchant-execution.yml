name: Temporary merchant execution gofmt
on:
  push:
    branches:
      - fix/merchant-catalog-strict-wire-v3
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/merchant-catalog-strict-wire-v3
          persist-credentials: true
      - name: gofmt touched executor and push
        shell: bash
        run: |
          set -euo pipefail
          gofmt -w internal/application/merchantcatalogai/execution.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/application/merchantcatalogai/execution.go
          if ! git diff --cached --quiet; then
            git commit -m "style(merchant-ai): gofmt updated approved executor"
            git push origin HEAD:fix/merchant-catalog-strict-wire-v3
          fi
