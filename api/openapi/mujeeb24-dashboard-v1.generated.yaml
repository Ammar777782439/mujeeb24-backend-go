      type: object
    AutomationRule:
      additionalProperties: false
      properties:
        action_kind:
          type: string
        action_payload:
          additionalProperties: {}
          type: object
        business_id:
          type: string
        conditions:
          additionalProperties: {}
          type: object
        created_at:
          format: date-time
          type: string
        id:
          type: string
        name:
          type: string
        position:
          format: int64
          type: integer
        resource_version:
          type: string
        status:
          type: string
        trigger_kind:
          type: string
        updated_at:
          format: date-time
          type: string
