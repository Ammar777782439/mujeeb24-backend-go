          readOnly: true
          type: string
        assignee_principal_id:
          format: uuid
          type: string
      required:
        - assignee_principal_id
      type: object
    AttributeDefinition:
      additionalProperties: false
      properties:
        data_type:
          type: string
        display_order:
          format: int64
          type: integer
        id:
          type: string
        key:
          type: string
        label:
          type: string
        required:
          type: boolean
        searchable:
          type: boolean
      required:
        - id
        - key
        - label
        - data_type
        - required
        - searchable
        - display_order
      type: object
    AttributeDefinitionInput:
      additionalProperties: false
      properties:
        data_type:
          type: string
        display_order:
          format: int64
          type: integer
        key:
          type: string
        label:
          type: string
        required:
          type: boolean
        searchable:
          type: boolean
      required:
        - key
        - label
        - data_type
        - required
        - searchable
        - display_order
      type: object
