info:
  title: Mujeeb 24 Dashboard API
  version: 1.0.0
openapi: 3.0.3
paths:
  /auth/login:
    post:
      operationId: authenticatePrincipal
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthOutputBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                $ref: "#/components/schemas/Cookie"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      security: []
      summary: Authenticate and issue JWT access token
      tags:
        - Auth
  /auth/logout:
    post:
      operationId: revokeRefreshSession
      parameters:
        - in: header
          name: Cookie
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Internal Server Error
      security:
        - bearerAuth: []
      summary: Revoke refresh session
      tags:
        - Auth
  /auth/refresh:
    post:
      operationId: rotateRefreshSession
      parameters:
        - in: header
          name: Cookie
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthOutputBody"
          description: OK
          headers:
            Set-Cookie:
              schema:
                $ref: "#/components/schemas/Cookie"
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Unauthorized
        "422":
          content:
            application/json:
              schema:
