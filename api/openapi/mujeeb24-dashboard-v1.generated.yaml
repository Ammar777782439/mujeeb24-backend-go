      additionalProperties: false
      properties:
        business_id:
          type: string
        conversation_id:
          type: string
        created_at:
          format: date-time
          type: string
        entities:
          additionalProperties: {}
          type: object
        evidence_references:
          items:
            type: string
          nullable: true
          type: array
        id:
          type: string
        intent_base:
          type: string
        lifecycle:
          type: string
        missing_information:
          items:
            type: string
          nullable: true
          type: array
        policy_version:
          type: string
        requested_action:
          type: string
        requires_human:
          type: boolean
      required:
        - id
        - business_id
        - intent_base
        - entities
        - evidence_references
        - requested_action
        - requires_human
        - missing_information
        - policy_version
        - lifecycle
        - created_at
      type: object
    AIHumanRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/v1/schemas/AIHumanRequest.json
          format: uri
          readOnly: true
          type: string
        reason:
          type: string
      required:
        - reason
      type: object
    AcceptTeamInvitationRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/v1/schemas/AcceptTeamInvitationRequest.json
          format: uri
          readOnly: true
          type: string
        acceptance_token:
          maxLength: 200
          minLength: 1
          type: string
      required:
        - acceptance_token
      type: object
    AssignConversationRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          example: /api/v1/schemas/AssignConversationRequest.json
