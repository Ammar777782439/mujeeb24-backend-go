        id:
          type: string
        locale:
          type: string
        name:
          type: string
        resource_version:
          type: string
        slug:
          type: string
        status:
          type: string
        timezone:
          type: string
        updated_at:
          format: date-time
          type: string
        vertical_type:
          type: string
