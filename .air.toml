root = "."
tmp_dir = "tmp"

[build]
bin = "tmp/main.exe"
cmd = "go build -o ./tmp/main.exe ./cmd/api"
delay = 800
exclude_dir = ["assets", "tmp", "vendor", "testdata", "deploy", "migrations", "docs", "tools", ".agents", ".git"]
include_ext = ["go", "tpl", "tmpl", "html"]
exclude_regex = ["_test.go"]
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
time = false

[misc]
clean_on_exit = true
